<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Выбор конкурсных групп</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .dropdown-box {
            max-height: 350px;
            overflow-y: auto;
            border: 1px solid #ccc;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 5px;
            background-color: #f8f9fa;
        }
        .group-box {
            margin-left: 20px;
            margin-top: 5px;
        }
        .form-check-label {
            cursor: pointer;
        }
    </style>
</head>
<body class="container py-4">
    <h2 class="mb-4 text-center">Выбор конкурсных групп</h2>

    <form method="POST" id="groupForm">
        <div class="dropdown-box">
            {% for code, groups in direction_map.items() %}
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="dir" id="dir-{{ code }}"
                        onchange="toggleGroups('{{ code }}')" {% if code in expanded_dirs %}checked{% endif %}>
                    <label class="form-check-label fw-bold" for="dir-{{ code }}">{{ code }}</label>
                </div>

                <div id="groups-{{ code }}" class="group-box" style="display: {{ 'block' if code in expanded_dirs else 'none' }};">
                    {% for g in groups %}
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="group" value="{{ g }}"
                                   id="group-{{ loop.index0 }}-{{ code }}"
                                   {% if g in selected_groups %}checked{% endif %}>
                            <label class="form-check-label" for="group-{{ loop.index0 }}-{{ code }}">{{ g }}</label>
                        </div>
                    {% endfor %}
                </div>
            {% endfor %}
        </div>

        <div class="d-flex justify-content-center gap-3 mt-4">
            <button type="submit" formaction="/analytAll" class="btn btn-primary">Показать всех</button>
            <button type="submit" formaction="/analytOrig" class="btn btn-success">Показать с оригиналами</button>
        </div>
    </form>

    <script>
        function toggleGroups(code) {
            const section = document.getElementById('groups-' + code);
            const checkbox = document.getElementById('dir-' + code);
            const expanded = JSON.parse(sessionStorage.getItem('expandedDirs') || '[]');

            if (checkbox.checked) {
                section.style.display = 'block';
                if (!expanded.includes(code)) expanded.push(code);
            } else {
                section.style.display = 'none';
                const idx = expanded.indexOf(code);
                if (idx !== -1) expanded.splice(idx, 1);
            }

            sessionStorage.setItem('expandedDirs', JSON.stringify(expanded));
            saveCheckboxStates();
        }

        function saveCheckboxStates() {
            const dirStates = {};
            const groupStates = {};
            document.querySelectorAll('input[type=checkbox][name=dir]').forEach(cb => {
                dirStates[cb.id] = cb.checked;
            });
            document.querySelectorAll('input[type=checkbox][name=group]').forEach(cb => {
                groupStates[cb.id] = cb.checked;
            });
            sessionStorage.setItem('dirStates', JSON.stringify(dirStates));
            sessionStorage.setItem('groupStates', JSON.stringify(groupStates));
        }

        function restoreCheckboxStates() {
            const dirStates = JSON.parse(sessionStorage.getItem('dirStates') || '{}');
            const groupStates = JSON.parse(sessionStorage.getItem('groupStates') || '{}');

            for (let id in dirStates) {
                const cb = document.getElementById(id);
                if (cb) {
                    cb.checked = dirStates[id];
                    const code = id.replace('dir-', '');
                    const section = document.getElementById('groups-' + code);
                    if (section) section.style.display = dirStates[id] ? 'block' : 'none';
                }
            }

            for (let id in groupStates) {
                const cb = document.getElementById(id);
                if (cb) cb.checked = groupStates[id];
            }
        }

        window.onload = function () {
            restoreCheckboxStates();

            // 🎯 ВАЖНО: следим за изменениями флажков конкурсных групп
            document.querySelectorAll('input[type=checkbox][name=group]').forEach(cb => {
                cb.addEventListener('change', saveCheckboxStates);
            });
        };
    </script>
</body>
</html>
